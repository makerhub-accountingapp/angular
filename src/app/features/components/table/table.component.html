<p class="text-center bold margin-bottom-medium">Total : {{total}}</p>
<div class="height-custom border-custom">
<p-table [value]="details" stripedRows scrollable="true" [scrollHeight]="height">
    <ng-template #header>
    </ng-template>
    <ng-template #body let-detail>
        <tr>
            <td>{{detail.transactionDate | date:'dd/mm/yy HH:mm' }}</td>
            <td>{{detail.amount}}</td>
            <td>{{detail.category.name}}</td>
        </tr>
    </ng-template>
</p-table>
</div>
