<div class="list">
  @for (entity of entities; track $index) {
  <div class="list-item">
    <div>
      <p>{{ entity.transactionDate | date:'dd MMM yyyy HH:mm' }}</p>
    </div>
    <div class="flex-row space-between">
      <p>{{ entity.transaction.name }}</p>
      <p>{{ entity.amount }}€</p>
    </div>
  </div>
  }
</div>
