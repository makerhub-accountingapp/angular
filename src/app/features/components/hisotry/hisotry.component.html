<div class="list">
  @for (detail of details$ | async; track $index) {
  <div class="list-item border-solid-light radius-light">
    <div>
      <p>{{ detail.transactionDate | date:'dd MMM yyyy HH:mm' }}</p>
    </div>
    <div class="flex-row space-between">
      <p>{{ detail.transaction.name }}</p>
      <p>{{ detail.amount }}€</p>
    </div>
  </div>
  }
</div>
