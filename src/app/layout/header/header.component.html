<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title class="pointer title" routerLink="/home">
      <div class="select-container text-center flex-row align-center justify-center">

        <ion-select interface="popover" [(ngModel)]="currentAccountId">
          @for (account of accounts; track $index) {
            <ion-select-option [value]="account.id">{{ account.name }}</ion-select-option>
          }
        </ion-select>


      <!-- <select>
        @for (account of accounts; track $index) {
          <option [value]="account.id">{{ account.name }}</option>
        }
      </select> -->



      </div>
    </ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="openUserMenu()">
        <img src="../../../assets/icon/person-outline.svg" width="24" height="24">
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
