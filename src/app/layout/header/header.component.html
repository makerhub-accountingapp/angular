<ion-header>
  <ion-toolbar>
    @if (currentUser){
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>
    }
    <ion-title class="pointer title">
      @if (currentUser){
        <div class="select-container text-center flex-row align-center justify-center">
          <ion-select routerLink="/home" interface="popover" (ngModelChange)="onSelectChange($event)" [(ngModel)]="currentAccountId">
            @for (account of accounts; track $index) {
              <ion-select-option [value]="account.id">{{ account.name }}</ion-select-option>
            }
          </ion-select>
        </div>
      }
      @else {
        <p>Accounting App</p>
      }
        
    </ion-title>
    @if(currentUser){
      <ion-buttons slot="end">
        <ion-button (click)="openUserMenu()">
          <img src="../../../assets/icon/person-outline.svg" width="24" height="24">
        </ion-button>
      </ion-buttons>
    }
  </ion-toolbar>
</ion-header>
